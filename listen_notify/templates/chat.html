<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        #messages {
            height: 70vh;
            overflow-y: auto;
            padding: 1em;
            background: #fff;
            border-radius: 0.5em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 1em;
        }
        .message {
            margin-bottom: 0.5em;
            padding: 0.5em 1em;
            border-radius: 0.5em;
            background: #e9ecef;
        }
        .message .meta {
            font-size: 0.85em;
            color: #6c757d;
        }
        #form {
            background: #fff;
            border-radius: 0.5em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 1em;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4 text-center">Simple Chat</h2>
    <div id="messages"></div>
    <form id="form" class="row g-2 align-items-end">
        <div class="col-md-3">
            <input id="sender" class="form-control" placeholder="Your name" required />
        </div>
        <div class="col-md-7">
            <input id="content" class="form-control" placeholder="Type a message..." required autocomplete="off" />
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">Send</button>
        </div>
    </form>
</div>
<script>
    const ws = new WebSocket(`ws://${location.host}/message/ws`);
    const messagesDiv = document.getElementById('messages');
    const form = document.getElementById('form');
    const senderInput = document.getElementById('sender');
    const contentInput = document.getElementById('content');

    ws.onmessage = (event) => {
        let msg;
        try {
            msg = JSON.parse(event.data);
        } catch {
            return;
        }
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<span class="meta">[${msg.timestamp ? msg.timestamp.replace('T', ' ').slice(0, 19) : ''}] <b>${msg.sender}</b>:</span> ${msg.content}`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        const sender = senderInput.value.trim();
        const content = contentInput.value.trim();
        if (!sender || !content) return;
        await fetch('/message/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender, content })
        });
        contentInput.value = '';
    };

    window.onload = async () => {
        const res = await fetch('/message/list/');
        const msgs = await res.json();
        msgs.reverse().forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span class="meta">[${msg.timestamp ? msg.timestamp.replace('T', ' ').slice(0, 19) : ''}] <b>${msg.sender}</b>:</span> ${msg.content}`;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
